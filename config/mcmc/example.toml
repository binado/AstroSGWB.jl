# Example MCMC run config for scripts/run_mcmc.jl.
# Copy this file per experiment; the runner never edits notebooks/mcmc.jl.
# Cosmology family and importance adapter are fixed in the script
# (LambdaCDM + ModifiedPropagation + BNSMadauDickinsonImportanceModel).

version = 3

# Catalog path is relative to the repo root unless absolute.
catalog_path = "catalog.h5"
detectors = ["E1", "E2", "E3", "C2"]

# Hyperparameters to sample; the rest are fixed at their fiducial values.
# Omit this key (or set to []) to sample every hyperparameter.
sample_only = ["H0"]

# Likelihood: "default" samples every hyperparameter in sample_only, while
# "amplitude_marginalized" integrates one strictly multiplicative parameter out of the
# Gaussian likelihood and reconstructs it in post-processing. The marginalized parameter
# is named by amplitude_parameter (required for, and only valid under, that likelihood),
# must appear in [fiducials], and must NOT appear in sample_only -- it has no latent
# variable at all, though it does end up in the saved posterior group.
likelihood = "default"
# amplitude_parameter = "H0"      # "H0" or "R₀"
amplitude_num_nodes = 1024        # nodes on the prior-span grid: sizes the (spectrally
                                  # accurate) marginalization integral and both passes of
                                  # the reconstruction's two-pass refinement mesh
amplitude_prior_span_sigma = 10.0 # grid half-width in prior standard deviations

seed = 42
observation_time = 1.0

output_dir = "chains"
output_prefix = "chains"

[sampler]
nsamples = 3000
nadapts = 3000
target_acceptance = 0.9
ad_backend = "ForwardDiff"  # or "Enzyme" (reverse-mode, runtime activity)
nchains = 0                 # 0 -> use Base.Threads.nthreads(); if set, must match nthreads()

# Fiducial point (also the importance-sampling reference). Keys are the canonical
# Unicode hyperparameter names; non-ASCII keys must be quoted (TOML requirement).
[fiducials]
H0 = 67.66
"Ωm" = 0.3096
"Ξ₀" = 1.0
"Ξₙ" = 1.91
"γ" = 2.7
"κ" = 5.7
zpeak = 2.0
# Local merger rate in Gpc^-3 yr^-1 (matches COBA simulations). It is an ordinary
# hyperparameter: fixed here by default, sampled by adding it to sample_only and to
# HYPERPRIOR in scripts/run_mcmc.jl.
"R₀" = 161.0
