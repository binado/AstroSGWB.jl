# Amplitude-marginalized MCMC run: H0 is integrated out of the Gaussian likelihood
# instead of sampled, and reconstructed in post-processing from the amplitude sufficient
# statistics the chain publishes. Compare against a `sample_only = ["H0"]` run of the
# default likelihood on the same catalog and seed -- the two posteriors should agree to
# within MC error, at a fraction of the sampling cost.

version = 3

catalog_path = "catalog.h5"
detectors = ["E1", "E2", "E3", "C2"]

# H0 is deliberately absent: it has no latent variable under this likelihood. It still
# ends up in the saved posterior group, via the reconstruction.
sample_only = ["zpeak"]

likelihood = "amplitude_marginalized"
amplitude_parameter = "H0"
# The 1024 default, and that is not a concession. The model's log Z is spectrally accurate
# at 1024 nodes even at the ρ ≈ 400 of this network (the trapezoid's endpoint corrections
# vanish for a bump deep inside the prior box), and the reconstruction's quantile/rand
# re-mesh onto a localized bracket internally (see `QUADRATURE_NODES.md` and
# `GWBackgroundInference/src/amplitude.jl`'s module docstring) — the 2.2/18.6/37.2
# `quadrature_effective_nodes` progression that once forced 16384 measured a single
# prior-wide mesh and says nothing about the refined one the draws actually use.
amplitude_num_nodes = 1024
amplitude_prior_span_sigma = 10.0

seed = 42
observation_time = 1.0

output_dir = "chains"
output_prefix = "chains"

[sampler]
nsamples = 3000
nadapts = 3000
target_acceptance = 0.9
ad_backend = "ForwardDiff"
nchains = 0

[fiducials]
H0 = 67.66
"Ωm" = 0.3096
"Ξ₀" = 1.0
"Ξₙ" = 1.91
"γ" = 2.7
"κ" = 5.7
zpeak = 2.0
"R₀" = 161.0
