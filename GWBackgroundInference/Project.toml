name = "GWBackgroundInference"
uuid = "17b6d0b6-80a1-4842-aa05-e7535ef3d247"
version = "0.1.0"

[deps]
GWBackground = "6a24b920-6d62-45b7-87dc-84df6f794d62"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Trapezoid = "54ea0a13-c7c2-4df0-924a-d4e052cc338d"
Turing = "fce5fe82-541a-59a6-adf8-730c64b5f9a0"

# `FlexiChains` is a sampling/write-path dependency, not an inference one: only the
# netCDF-write helpers touch it, so they live in an extension and the package stays
# loadable without it. `InferenceObjects` stays a scripts/notebooks dep for convert/to_netcdf.
[weakdeps]
FlexiChains = "4a37a8b9-6e57-4b92-8664-298d46e639f7"

[extensions]
GWBackgroundInferenceFlexiChainsExt = "FlexiChains"

[extras]
FlexiChains = "4a37a8b9-6e57-4b92-8664-298d46e639f7"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "FlexiChains"]

[sources]
GWBackground = {path = "../GWBackground"}
Trapezoid = {path = "../Trapezoid"}

[compat]
Distributions = "0.25.123"
FlexiChains = "0.6"
Trapezoid = "0.1.0"
Turing = "0.45"
julia = "1.12"
